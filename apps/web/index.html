<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f0e8" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tandem" />
    <title>Tandem — the canvas that never loses a thought</title>
    <meta name="description" content="A real-time, offline-first whiteboard with time travel, connectors, comments and a local AI." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='17' height='17' rx='4' fill='%232f63ff'/%3E%3Crect x='12' y='12' width='17' height='17' rx='4' fill='%23ff8a5b' fill-opacity='.9'/%3E%3C/svg%3E" />
    <script>
      // Resolve the theme before first paint (same rules as src/canvas/theme.ts).
      (function () {
        var pref = "system";
        try { pref = localStorage.getItem("canvas:theme") || "system"; } catch (e) {}
        var dark = pref === "dark" || (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.dataset.page = /^\/b\//.test(location.pathname) || /[?&]doc=/.test(location.search) ? "board" : "site";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
